[versions]
aGPVersion = "8.9.1" # AGP
kotlinGPVersion = "2.2.0"
kspVersion = "2.2.0-2.0.2"
koverVersion = "0.9.1"
jvm = "17"
minSdk = "24"
targetSdk = "36"
compileSdk = "36"

[plugins]
android-app-gp = { id = "com.android.application", version.ref = "aGPVersion" }
android-lib-gp = { id = "com.android.library", version.ref = "aGPVersion" }
kotlin-gp = { id = "org.jetbrains.kotlin.android", version.ref = "kotlinGPVersion" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinGPVersion" }
kotlin-jvm-gp = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinGPVersion" }
ksp = { id = "com.google.devtools.ksp", version.ref = "kspVersion" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "koverVersion" }
